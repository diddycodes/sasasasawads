<!DOCTYPE html>
<html>
<head>
  <title>Visitor Logger</title>
  <style>
    #admin {
      position: fixed;
      top: 10px;
      right: 10px;
      background: #eee;
      padding: 10px;
      border-radius: 5px;
    }
    #logData {
      white-space: pre-wrap;
      background: #f9f9f9;
      padding: 10px;
      margin-top: 10px;
      max-height: 300px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <h1>Welcome to the Website</h1>

  <div id="admin">
    <button onclick="showLogin()">Admin</button>
    <div id="login" style="display:none;">
      <input id="user" placeholder="Username"><br>
      <input id="pass" placeholder="Password" type="password"><br>
      <button onclick="login()">Login</button>
    </div>
    <div id="logData" style="display:none;"></div>
  </div>

  <script>
    function showLogin() {
      document.getElementById("login").style.display = "block";
    }

    async function login() {
      const u = document.getElementById("user").value;
      const p = document.getElementById("pass").value;
      if (u === "admin" && p === "admin") {
        const res = await fetch("/api/log");
        const data = await res.json();
        document.getElementById("logData").innerText = JSON.stringify(data, null, 2);
        document.getElementById("logData").style.display = "block";
      } else {
        alert("Invalid login");
      }
    }

    // Send IP log on page load
    fetch("/api/log", { method: "POST" });
  </script>
</body>
</html>
